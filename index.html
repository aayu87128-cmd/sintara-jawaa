#app{min-height:100%;padding:16px 12px 90px;display:flex;justify-content:center;align-items:flex-start}
.card{background:var(--krem);border:2px solid var(--coklat);border-radius:14px;padding:20px;width:100%;max-width:820px;margin:auto;box-shadow:0 6px 18px rgba(0,0,0,.3)}
h1{font-size:clamp(2.4rem,9vw,4rem);margin:.2em 0;letter-spacing:.06em;text-align:center}
h2{margin:.2em 0 .6em;text-align:center}
p,li{line-height:1.65}
.center{text-align:center}
.wayang{display:block;margin:0 auto 12px;max-height:240px;max-width:100%;border-radius:12px;border:3px solid var(--coklat)}
.btn{font:inherit;font-weight:bold;background:#1a0f0c;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:4px;text-decoration:none;display:inline-block}
.btn:hover{background:#5a3a30}.btn:focus-visible,.fish:focus-visible{outline:3px solid var(--emas)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid .btn{background:#fffaf0;color:var(--coklat);border:1.5px solid var(--coklat);padding:14px}
.grid .btn:hover{background:var(--emas)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.tab{font:inherit;padding:7px 12px;border:1.5px solid var(--coklat);border-radius:20px;background:#fff;cursor:pointer}
.tab.on{background:var(--coklat);color:#fff}
.box{background:#fff;border-left:5px solid var(--emas);padding:6px 14px;margin:10px 0;border-radius:6px}
.dialog p{margin:.3em 0}
textarea{width:100%;min-height:150px;font:inherit;padding:10px;border:1.5px solid var(--coklat);border-radius:8px}
.bar{background:#e3d5c4;border-radius:10px;height:18px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,var(--emas));transition:width .5s}
.yt{position:relative;padding-top:56.25%;margin:10px 0}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
/* ===== BAR NAVIGASI ===== */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--coklat);padding:10px;text-align:center;z-index:5}
#nav button{font:inherit;font-weight:bold;background:var(--emas);border:0;border-radius:8px;padding:9px 18px;margin:0 4px;cursor:pointer}
#nav button:disabled{opacity:.45;cursor:default}
/* ===== GAME MANCING ===== */
.sea{position:relative;height:min(62vh,520px);overflow:hidden;border-radius:12px;border:3px solid #0b6e99;background:linear-gradient(#7fd8f5,#1aa3d9 55%,#0b6e99);touch-action:none;cursor:none;user-select:none}
.sea .deco{position:absolute;bottom:0;left:0;right:0;font-size:2rem;display:flex;justify-content:space-around;opacity:.9;pointer-events:none}
.sea .pulau{position:absolute;top:4px;left:8px;font-size:2rem;pointer-events:none}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.skor{background:var(--emas);border-radius:20px;padding:4px 14px;font-weight:bold;white-space:nowrap}
.fish{position:absolute;display:flex;flex-direction:column;align-items:center;font-size:2.4rem;cursor:pointer;border:0;background:none;animation:swim linear infinite alternate;line-height:1}
.fish b{font-size:.85rem;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:12px;color:#073b57;margin-top:2px}
.fish:hover,.sea:active .fish:hover{animation-play-state:paused}
.fish.benar b{background:#7be08a}.fish.salah b{background:#ff9a8f}
@keyframes swim{from{left:2%}to{left:68%}}
#net{position:absolute;font-size:3rem;pointer-events:none;transform:translate(-50%,-50%);transition:left .25s,top .25s;left:50%;top:50%;z-index:3}
#fb{min-height:1.6em;font-weight:bold;text-align:center}
@media (prefers-reduced-motion:reduce){.fish{animation-duration:30s!important}}
.cp-meta{line-height:1.9;margin-bottom:12px;padding:12px;background:#fff0ce;border-left:5px solid var(--emas);border-radius:8px}\n</style>
</head>

  <h1>SINTARA</h1><h3>Sinau Tata Krama</h3>

P.menu = ()=>`<div class="card"><h2>Pilih Kegiatan</h2><div class="grid">
  ${[["cp","Capaian Pembelajaran"],["tp","Tujuan Pembelajaran"],["materi","Materi Pembelajaran"],["crita","Crita Watu Blorok"],["tata","Dolanan Mancing"],["skor","Skor Game"],["gladhen","Gladhen"],["progres","Progres"],["evaluasi","Evaluasi lan Asil"]]

const MATERI = {
 "Pambuka":`<p>Unggah-ungguh basa yaiku sarana kanggo komunikasi, nglantarake maksud marang wong liya lan kudu mangerteni sapa sing diajak guneman. Unggah-ungguh basa sing lumrah digunakake ana 4: ngoko lugu, ngoko alus, krama lugu, lan krama alus.</p>`,
 "Ngoko lugu":`<p><b>Ngoko lugu</b> yaiku basa ngoko sing ora kecampuran tembung krama. Sipate rumaket utawa akrab.</p><b>Panganggone:</b><ol><li>Dienggo sapadha-padha kang wis kulina.</li><li>Dienggo ndhuwuran marang andhahan.</li><li>Dienggo wong tuwa marang sing enom (wong tuwa marang anak, guru marang murid, eyang marang putu).</li></ol><div class="box"><b>Tuladha:</b><br>1. Kowe gelem turu kene, Mbak?<br>2. Kowe sesuk apa sida lunga?<br>3. Kowe ditukokake jajan pasar?</div>`,
 "Ngoko alus":`<p><b>Ngoko alus</b> yaiku basa ngoko sing kecampuran tembung krama inggil kanggo wong sing diajak pacaturan. Tembung <i>kowe</i> dadi <i>sampeyan</i>.</p><b>Panganggone:</b><ol><li>Sedulur enom marang sedulur tuwa.</li><li>Wong tuwa marang wong enom sing drajade luwih dhuwur.</li><li>Ibu marang bapak sing wis kulina nganggo ngoko.</li></ol><div class="box"><b>Tuladha:</b><br>1. Sampeyan purun tilem mriki, Mbak?<br>2. Sampeyan sesuk lungga?<br>3. Sampeyan dipuntumbasaken jajan pasar?</div>`,
 "Krama lugu":`<p><b>Krama lugu</b> yaiku basa krama sing ora kecampuran krama inggil. <i>Kowe</i> dadi <i>panjenengan</i>, <i>aku</i> dadi <i>kula</i>.</p><b>Panganggone:</b><ol><li>Marang kanca sing wis kulina, padha drajade lan ngajeni.</li><li>Garwane priyayi marang sing kakung.</li><li>Priyayi marang sedulure tuwa kang luwih cendhek drajade.</li></ol><div class="box"><b>Tuladha:</b><br>1. Panjenengan kersa sare kene, Mbak?<br>2. Panjenengan sesuk apa sida tindak?<br>3. Panjenengan dipundhutake jajan pasar?</div>`,
 "Krama alus":`<p><b>Krama alus</b> yaiku basa krama sing tembunge alus lan kecampuran krama inggil kanggo wong sing diajak pacaturan.</p><b>Panganggone:</b><ol><li>Wong enom marang wong tuwa.</li><li>Anak marang bapak utawa ibune.</li><li>Putu marang eyang.</li><li>Ponakan marang pakdhe/budhe.</li><li>Marang wong sing luwih dhuwur drajade.</li><li>Murid marang gurune.</li><li>Andhahan marang pimpinane.</li><li>Abdi marang juragane.</li></ol><div class="box"><b>Tuladha:</b><br>1. Panjenengan kersa sare mriki, Mbak?<br>2. Panjenengan benjing menapa tamtu tindak?<br>3. Panjenengan dipunpundhutaken jajan pasar?</div>`,
 "Contoh dialog":`<div class="dialog box">
 <p><b>Warga:</b> Kula nuwun.</p><p><b>Bu RT:</b> Inggih, mangga, sinten?</p><p><b>Warga:</b> Inggih, ngapunten Bu, kula saking RT 7.</p><p><b>Bu RT:</b> Lho, Mbak, wonten napa?</p><p><b>Warga:</b> Kula badhe urun rembag ngawontenaken gugur gunung resik Balai Desa. Kula nyuwun samukawis sapu.</p><p><b>Bu RT:</b> Butuh pinten?</p><p><b>Warga:</b> Sekawan mawon, Bu.</p><p><b>Bu RT:</b> Inggih, sik dak pendhetake.</p><p><b>Warga:</b> Matur sembah nuwun, Bu. Kula nyuwun pamit. Sugeng pepisahan.</p></div>`
};
let tabAktif="Pambuka";
P.materi = ()=>`<div class="card"><h2>Unggah-Ungguh Basa Jawa</h2>
  <div class="tabs">${Object.keys(MATERI).map(k=>`<button class="tab ${k==tabAktif?'on':''}" onclick="tabAktif='${k}';render()">${k}</button>`).join("")}</div>
  ${MATERI[tabAktif]}</div>`;

P.crita = ()=>`<div class="card"><h2>Legenda Watu Blorok</h2>
  <div class="yt"><iframe src="${DATA.linkYoutube}" title="Crita Watu Blorok" allowfullscreen></iframe></div>
  <p class="center"><a class="btn" href="${DATA.linkYoutubeAsli}" target="_blank" rel="noopener">Bukak ing YouTube</a></p>
  <p>Ing pinggir dalan gedhe antarane Mojokerto lan Gresik, ana watu sing corake ireng putih, dibuntel kain lusuh, lan kerep diwenehi sesaji. Wong-wong padha percaya yen watu iku nyimpen kutukan saka jaman Majapahit.</p>
  <p>Jarene, biyen ana kesatria Majapahit sing jenenge Wiro Bastam. Nalika dheweke mburu Kijang Kencana ing alas Mojoroto, tombak pusakane ilang. Kanggo nebus kaluputan bapakne, anake loro, Joko Welas lan Roro Wilis, wani mlebu ing alas larangan kanggo nggoleki pusaka iku.</p>
  <p>Ing dalan tumuju alas Mojoroto, Joko Welas adu kekuwatan karo para pertapa ing sawijining sendang. Dene adhine, Roro Wilis tiba ing sumur beracun ing Wana Bendo amarga dijebak wong wadon tuwa. Kulit saka sirah tekan sikile dadi bintik-bintik ireng putih (blorok).</p>
  <p>Nalika kakang lan adhi iki ketemu, Joko Welas ora percaya yen wong wadon kuwi adhine dhewe. Banjur sadulur loro iku pasulayan. Kabar perang iku tekan ing kupinge Wiro Bastam. Dheweke teka kanthi ati remuk lan takon marang anak-anake, nanging ora ana siji wae sing mangsuli.</p>
  <p>Amarga mangkel, Wiro Bastam ora sengaja ngucapake kutukan, “arek loro dadiya watu”. Roro Wilis malih dadi Watu Blorok, dene Joko Welas dadi watu ing sabrange. Kalorone adeg-adegan nganti saiki.</p>
  <p>Wiwit iku, wewengkon kono dianggep wingit. Para pengendara nyuwara klakson minangka tandha nuwun sewu, nyebar dhuwit receh supaya slamet, lan sesaji isih terus dikirim nganti dina iki. Sanadyan ana sing ora percaya, crita iki tetep urip dadi crita rakyat sing lestari.</p></div>`;

P.tata = ()=>`<div class="card"><h2>Dolanan Mancing: Tata Cara Main</h2>
  <ol><li>Ana <b>5 soal</b>. Saben soal ana 4 iwak sing nggawa tembung.</li>
  <li>Gerakna <b>jaring</b> nganggo mouse utawa ilat driji ing layar HP.</li>
  <li>Klik / tutul iwak sing nggawa tembung <b>sing bener</b>.</li>
  <li>Saben soal mung bisa dipilih <b>siji kaping</b>.</li>
  <li>Jawaban bener entuk <b>${DATA.skorPerSoal} poin</b>. Yen bener kabeh, skor <b>${DATA.skorPerSoal*DATA.soal.length}</b>.</li>
  <li>Jawaban salah ora entuk poin, nanging ana katrangan.</li></ol>
  <p class="center"><button class="btn" onclick="go('game')">MULAI MAIN 🎣</button></p></div>`;

/* ----- GAME ----- */
let G;
P.game = ()=>{ G={i:0,skor:0,kunci:false,bener:0}; return `<div class="card">
  <div class="gbar"><button class="btn" onclick="go('tata')">←</button><b class="center" id="gSoal"></b><span class="skor">Skor: <span id="gSkor">0</span></span></div>
  <p id="gTanya" class="center"></p>
  <div class="sea" id="sea"><span class="pulau">🏝️</span><div id="net">🥅</div><div class="deco"><span>🪸</span><span>🌿</span><span>🪸</span><span>🌿</span><span>🪸</span></div></div>
  <p id="fb"></p><p class="center"><button class="btn" onclick="go('game')">Ulangi</button></p></div>`;};
P.game.after = ()=>{
  const sea=$("#sea"), net=$("#net");
  sea.addEventListener("pointermove",e=>{const r=sea.getBoundingClientRect();net.style.transition="none";net.style.left=(e.clientX-r.left)+"px";net.style.top=(e.clientY-r.top)+"px";});
  tampilSoal();
};
function tampilSoal(){
  const q=DATA.soal[G.i], sea=$("#sea");
  G.kunci=false; $("#fb").textContent="";
  $("#gSoal").textContent=`Soal ${G.i+1}/${DATA.soal.length}`; $("#gTanya").innerHTML=q.tanya;
  sea.querySelectorAll(".fish").forEach(f=>f.remove());
  const ikan=["🐟","🐠","🐡","🐟"], baris=[14,34,54,72];
  [...q.pilihan].sort(()=>Math.random()-.5).forEach((kata,n)=>{
    const f=document.createElement("button");
    f.className="fish"; f.innerHTML=`${ikan[n]}<b>${kata}</b>`;
    f.style.top=baris[n]+"%"; f.style.animationDuration=(14+n*4)+"s"; f.style.animationDelay=(-n*2)+"s";
    f.onclick=()=>pilih(f,kata);
    sea.appendChild(f);
  });
}
function pilih(f,kata){
  if(G.kunci) return; G.kunci=true;      // saben soal mung sepisan
  const q=DATA.soal[G.i], net=$("#net"), sea=$("#sea"), r=sea.getBoundingClientRect(), b=f.getBoundingClientRect();
  net.style.transition="left .25s,top .25s"; net.style.left=(b.left+b.width/2-r.left)+"px"; net.style.top=(b.top+b.height/2-r.top)+"px";
  document.querySelectorAll(".fish").forEach(x=>{x.style.animationPlayState="paused";x.disabled=true;});
  const ok = kata===q.jawaban;
  f.classList.add(ok?"benar":"salah");
  if(ok){G.skor+=DATA.skorPerSoal;G.bener++;$("#gSkor").textContent=G.skor;}
  $("#fb").textContent = ok ? "✅ Bener! +"+DATA.skorPerSoal+" poin. "+q.katrangan : "❌ Durung trep. Jawaban sing bener: "+q.jawaban+". "+q.katrangan;
  setTimeout(()=>{ if(++G.i<DATA.soal.length) tampilSoal(); else{ S.skor=G.skor; S.bener=G.bener; simpen(); go('skor'); } },3200);
}
P.skor = ()=>{ const t=DATA.soal.length*DATA.skorPerSoal, s=S.skor??0;
  const pesan = s>=t?"Jago unggah-ungguh!":s>=t*.6?"Apik! Sinau maneh supaya luwih sampurna.":"Ayo sinau maneh materi unggah-ungguh.";
  return `<div class="card center"><h2>🏆 Sugeng! Misi Rampung!</h2><p>Kowe wis ngrampungake kabeh ${DATA.soal.length} misi pilihan tembung krama inggil.</p>
  <h3>TOTAL SKOR</h3><h1>${s}/${t}</h1><p>Jawaban bener: ${S.bener??0} saka ${DATA.soal.length}</p><p><b>${pesan}</b></p>
  <button class="btn" onclick="go('game')">Main maneh</button><button class="btn" onclick="go('gladhen')">Terusna Gladhen</button></div>`; };

/* ----- GLADHEN ----- */
let glAktif=0;
P.gladhen = ()=>{ const g=DATA.gladhen[glAktif];
  return `<div class="card"><h2>Gladhen</h2>
  <div class="tabs">${DATA.gladhen.map((x,i)=>`<button class="tab ${i==glAktif?'on':''}" onclick="glAktif=${i};render()">${x.judul} ${S.gl[i].trim().length>=20?'✔':''}</button>`).join("")}</div>
  ${g.dialog?`<div class="dialog box">${DATA.dialogGladhen.map(d=>`<p><b>${d[0]}:</b> ${d[1]}</p>`).join("")}</div>`:""}
  <p><b>GLADHEN ${g.judul.toUpperCase()}:</b> ${g.teks}</p>
  <textarea id="gl" placeholder="Tulisen jawaban ing kene...">${S.gl[glAktif]}</textarea>
  <p class="center"><button class="btn" onclick="simpenGl()">Simpen Jawaban</button></p><p id="glMsg" class="center"></p></div>`; };
function simpenGl(){ S.gl[glAktif]=$("#gl").value; simpen();
  $("#glMsg").textContent = S.gl[glAktif].trim().length>=20 ? "✔ Jawaban kasimpen. Progres nambah!" : "Jawaban kasimpen, nanging isi minimal 20 aksara supaya diitung rampung."; }

/* ----- PROGRES ----- */
P.progres = ()=>{ const gm=S.skor??0, gr=gladhenRampung();
  const persen=Math.round((gm/100*50) + (gr/3*50));   // game 50% + gladhen 50%
  const bar=(l,v)=>`<p>${l}</p><div class="bar"><i style="width:${v}%"></i></div>`;
  return `<div class="card"><h2>Progres Sinau</h2>
  ${bar("Dolanan Mancing: skor "+gm+"/100",gm)}${bar("Gladhen rampung: "+gr+"/3 level",Math.round(gr/3*100))}${bar("Total progres: "+persen+"%",persen)}
  <p class="center"><button class="btn" onclick="if(confirm('Reset kabeh progres?')){S={skor:null,gl:['','','']};simpen();render()}">Reset progres</button></p></div>`; };

/* ----- EVALUASI ----- */
P.evaluasi = ()=>`<div class="card center"><h2>Evaluasi lan Asil Pembelajaran</h2>
  <p>Skor Game: ${S.skor??0} poin</p><p>Gladhen rampung: ${gladhenRampung()}/3 level</p><hr>
  <h3>Evaluasi</h3><p>Garapen soal evaluasi liwat tautan iki.</p><a class="btn" href="${DATA.linkEvaluasi}" target="_blank" rel="noopener">BUKA EVALUASI</a>
  <h3>Remedial</h3><p>Yen nilaimu kurang saka KKM, banjur garapen remedial ing ngisor iki.</p><p><b>(KKM: 75)</b></p><a class="btn" href="${DATA.linkRemedial}" target="_blank" rel="noopener">BUKA REMEDIAL</a><hr>
  <p>Matur nuwun wis sinau nganggo SINTARA.</p><button class="btn" onclick="go('menu')">BALIK MENU</button></div>`;

/* ============ NAVIGASI ============ */
const URUT=["cover","menu","cp","tp","materi","crita","tata","game","skor","gladhen","progres","evaluasi"];
let hal="cover";
function go(k){ hal=k; render(); window.scrollTo(0,0); }
function render(){
  app.innerHTML=P[hal](); if(P[hal].after) P[hal].after();
  const i=URUT.indexOf(hal); $("#bBack").disabled=i<=0; $("#bNext").disabled=i>=URUT.length-1;
  $("#nav").style.display = hal=="cover"?"none":"block";
}
$("#bBack").onclick=()=>go(hal=="game"||hal=="skor"?"tata":URUT[URUT.indexOf(hal)-1]);
$("#bNext").onclick=()=>go(URUT[URUT.indexOf(hal)+1]);
$("#bMenu").onclick=()=>go("menu");
render();
</script>
</body>
</html>
